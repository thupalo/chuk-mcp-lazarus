[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chuk-mcp-lazarus"
version = "0.15.0"
description = "Mechanistic interpretability MCP server wrapping chuk-lazarus"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Christopher Hay"}
]
dependencies = [
    "chuk-mcp-server>=0.25",
    "chuk-lazarus>=0.4.1",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Linux x86_64 + NVIDIA GPU (MLX CUDA backend). Needs driver >= 550 and
# compute capability >= 7.5 (Turing or newer). MLX JIT-compiles kernels with
# NVRTC 12.9; its bundled CCCL headers need CUDA >= 12.8 toolkit headers
# (e.g. __nv_fp8_e8m0), which nvidia-cuda-runtime-cu12 provides, so an older
# system toolkit in /usr/local/cuda is not used for bf16 gather kernels.
cuda = [
    "mlx[cuda12]>=0.31.1; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12>=12.9,<13; sys_platform == 'linux'",
]
# Linux without a GPU (MLX CPU backend).
cpu = [
    "mlx[cpu]>=0.31.1; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
]

[project.scripts]
chuk-mcp-lazarus = "chuk_mcp_lazarus.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chuk_mcp_lazarus*"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100
